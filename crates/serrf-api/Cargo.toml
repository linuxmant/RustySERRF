[package]
name = "serrf-api"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "serrf-api"
path = "src/main.rs"

[lib]
name = "serrf_api"
path = "src/lib.rs"

[dependencies]
serrf-core = { path = "../serrf-core" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
async-stream = "0.3"
zip = "0.6"
futures-core = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
rust-embed = { version = "8.12.0", optional = true }
open = { version = "5.4.2", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
ndarray = "0.15"
uuid = { version = "1", features = ["v4"] }

[features]
bundled-frontend = ["dep:rust-embed", "dep:open"]
